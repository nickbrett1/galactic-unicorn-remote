<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <!-- iOS caches apple-touch-icon per URL, and static assets are served with
         max-age=14400, so overwriting the artwork in place leaves phones on the
         old image for up to 4h. Bump ?v= whenever the icon changes: the path
         stays identical (the Cloudflare Access bypass is scoped to it) while
         the URL changes, which busts both the edge and the device cache. -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-180.png?v=3"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Home Display" />
    <meta name="theme-color" content="#0b0e0d" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
