# Homepage `services.yaml` snippet for galactic-unicorn-remote.
#
# Paste under the "Activity" group of Homepage's `services.yaml`, in alphabetical
# order. The tile is an **iframe** of the service's own read-only mirror `/tile`
# (like the DeepSeek Balance tile): the panel's state, the live countdown and the
# liveness heartbeat, with no controls — a click-through (`href`) opens the real
# remote at `home-display.fintechnick.com`.
#
# `src` must be reachable *by the browser*, so it uses the NAS hostname and the
# PUBLISHED host port (3009) — never `localhost` (`localhost` in an iframe is the
# viewer's own machine) and never the Cloudflare hostname, which is Access-gated
# and would not render inside an iframe.
#
# The Docker auto-discovery labels are deliberately NOT set on the container
# (`docker-compose.yml`): with them, Homepage's `docker.yaml` provider injects a
# second, health-only tile under "Services".

- Galactic Unicorn:
    icon: mdi-unicorn-variant
    href: https://home-display.fintechnick.com
    description: Galactic Unicorn panel — tap through to control the countdowns
    siteMonitor: http://127.0.0.1:3009/health
    widget:
      type: iframe
      src: http://nas:3009/tile
      classes: h-80 md:h-[24rem] lg:h-[26rem]
      refreshInterval: 5000
