# Docker Compose configuration for galactic-unicorn-remote
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/galactic-unicorn-remote:latest
    container_name: galactic-unicorn-remote
    restart: unless-stopped

    ports:
      - "0.0.0.0:3009:3000"

    # House convention on the NAS: cap container memory with a compose
    # mem_limit rather than letting a runaway process take the box. 512m is
    # generous for a service that only holds a state mirror plus the audit log.
    mem_limit: 512m

    # The token is a runtime environment value, never a committed default:
    # the service refuses to start in a non-dev run without it
    # (implementation-considerations §7.5, AD-14). Compose reads it from the
    # `.env` file beside this one (mode 600, never committed — see
    # .env.example), and `:?` fails the deploy loudly rather than starting a
    # container that would exit on boot.
    environment:
      DEVICE_TOKEN: ${DEVICE_TOKEN:?DEVICE_TOKEN must be set — copy .env.example to .env and fill it in, or export it}
      # The wedge watchdog (powercycle.js) is inert unless POWER_CYCLE_ENABLED
      # is 1 AND KASA_HOST names the HS100. Compose forwards nothing it is not
      # told to, so these are listed here with safe defaults; the NAS-side
      # `.env` overrides them without touching this file.
      POWER_CYCLE_ENABLED: ${POWER_CYCLE_ENABLED:-0}
      KASA_HOST: ${KASA_HOST:-}
      KASA_PORT: ${KASA_PORT:-9999}
      POWER_CYCLE_STALE_S: ${POWER_CYCLE_STALE_S:-180}
      POWER_CYCLE_COOLDOWN_S: ${POWER_CYCLE_COOLDOWN_S:-600}
      POWER_CYCLE_MAX: ${POWER_CYCLE_MAX:-2}
      POWER_CYCLE_OFF_MS: ${POWER_CYCLE_OFF_MS:-5000}
      POWER_CYCLE_CHECK_MS: ${POWER_CYCLE_CHECK_MS:-15000}
    labels:
      # Watchtower pulls new images; nothing here drives the Homepage tile.
      # The dashboard tile lives in Homepage's own services.yaml (see
      # deploy/homepage-services.yaml) — the Docker auto-discovery provider
      # would otherwise add a *second*, health-only tile under "Services".
      - "com.centurylinklabs.watchtower.enable=true"
